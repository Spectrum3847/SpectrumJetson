# SystemCore as the robot's PTP grandmaster (hardware timestamps on eth0).
# Coprocessors (Jetsons) run ptp4l as clients plus phc2sys, so their clocks follow this one.
[global]
serverOnly              1
priority1               10
priority2               10
domainNumber            0
time_stamping           hardware
network_transport       UDPv4
delay_mechanism         E2E
logSyncInterval         -3
logAnnounceInterval     0
fault_reset_interval    1
summary_interval        6
