// The SystemCore build: WPILib 2027 alpha-6, PhotonLib 2027 alpha-2. Sources: generated from
// src/main by tools/port2027.py, + src/compat2027. WPILib 2027 comes from the local WPILib
// install (~/wpilib/2027/maven), as GradleRIO 2027 uses it.
def wpilib = '2027.0.0-alpha-6'
def photon = 'v2027.0.0-alpha-2'
def gen = layout.buildDirectory.dir('generated/port2027')

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

repositories {
    maven { url = uri("${System.getProperty('user.home')}/wpilib/2027/maven") }
    maven { url = 'https://maven.photonvision.org/releases' }
    maven { url = 'https://maven.ctr-electronics.com/release/' }                      // examples only
    // AdvantageKit (examples only), from its GitHub release's offline Maven repo, which build.sh
    // downloads: frcmaven.wpi.edu, where it's normally hosted, isn't reachable from every network.
    exclusiveContent {
        forRepository {
            maven { url = uri("${System.getProperty('user.home')}/.cache/spectrum-vision-deps/akit-v27.0.0-alpha-4/maven_offline") }
        }
        filter { includeGroup 'org.littletonrobotics.akit' }
    }
    mavenCentral()
}

def port = tasks.register('port2027', Exec) {
    inputs.dir('../src/main/java')
    inputs.dir('../src/test/java')
    inputs.file('../tools/port2027.py')
    inputs.dir('../examples')
    outputs.dir(gen)
    commandLine 'python3', "${rootDir}/tools/port2027.py", gen.get().asFile.path
}

sourceSets {
    main { java { srcDirs = [gen.map { it.dir('main/java') }, '../src/compat2027/java'] } }
    test { java { srcDirs = [gen.map { it.dir('test/java') }] } }
    examples { java { srcDirs = [gen.map { it.dir('examples/java') }] } }
    simTest { java { srcDirs = [gen.map { it.dir('simTest/java') }] } }
    // 2027-only (not ported): tests/systemcore-rehearsal/run.sh runs it against a real Jetson.
    rehearsal { java { srcDirs = ['src/rehearsal/java'] } }
}

configurations { simNatives }
tasks.named('compileJava') { dependsOn port }
tasks.named('compileTestJava') { dependsOn port }
tasks.named('compileExamplesJava') { dependsOn port }
tasks.named('compileSimTestJava') { dependsOn port }
tasks.named('test') { dependsOn 'compileExamplesJava' }

dependencies {
    def wpi = [
        "org.wpilib.wpilibj:wpilibj-java:$wpilib", "org.wpilib.wpimath:wpimath-java:$wpilib",
        "org.wpilib.wpiutil:wpiutil-java:$wpilib", "org.wpilib.ntcore:ntcore-java:$wpilib",
        "org.wpilib.hal:hal-java:$wpilib", "org.wpilib.apriltag:apriltag-java:$wpilib",
        "org.wpilib.wpiunits:wpiunits-java:$wpilib", "org.wpilib.cscore:cscore-java:$wpilib",
        "org.wpilib.cameraserver:cameraserver-java:$wpilib", "org.wpilib.datalog:datalog-java:$wpilib",
        "org.wpilib.thirdparty.opencv:opencv-java:2027-4.13.0-3",
        "org.photonvision:photonlib-java:$photon", "org.photonvision:photontargeting-java:$photon",
        "org.ejml:ejml-simple:0.44.0", "us.hebi.quickbuf:quickbuf-runtime:1.4",
        "io.avaje:avaje-jsonb:3.11", "io.avaje:avaje-json-core:3.11",
    ]
    wpi.each { compileOnly it; testImplementation it; examplesImplementation it; simTestImplementation it; rehearsalImplementation it }
    rehearsalImplementation sourceSets.main.output
    simTestImplementation sourceSets.main.output
    simTestImplementation platform('org.junit:junit-bom:5.10.1')
    simTestImplementation 'org.junit.jupiter:junit-jupiter'
    simTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    ['wpiutil', 'wpimath', 'wpinet', 'ntcore', 'hal', 'cscore', 'apriltag', 'datalog'].each {
        simNatives "org.wpilib.${it}:${it}-cpp:$wpilib:linuxx86-64@zip"
    }
    simNatives 'org.wpilib.thirdparty.opencv:opencv-cpp:2027-4.13.0-3:linuxx86-64@zip'
    simNatives "org.photonvision:photontargeting-cpp:$photon:linuxx86-64@zip"
    examplesImplementation sourceSets.main.output
    // The versions 2026-FM-SystemCore uses with WPILib 2027 alpha-6:
    examplesImplementation 'com.ctre.phoenix6:wpiapi-java:26.50.0-alpha-1'
    examplesImplementation 'org.littletonrobotics.akit:akit-java:27.0.0-alpha-4'
    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('sourceDrop', Zip) {
    dependsOn port
    archiveFileName = 'SpectrumVision-wpilib2027-src.zip'
    destinationDirectory = layout.buildDirectory.dir('drop')
    from(gen.map { it.dir('main/java') }) { include 'org/**' }
    from('../src/compat2027/java') { include 'org/**' }
}

// The end-to-end simulation test, as on 2026. WPILib 2027's desktop libraries need glibc 2.38 and
// GCC 13's C++ runtime: on an older system (Ubuntu 22.04) the copies unpacked here are patched by
// tools/ubuntu2204-sim/glibc238_compat.py and get the newer libstdc++ that build.sh downloads
// (tools/ubuntu2204-sim/get-libstdcxx.sh). On a newer system the patcher changes nothing.
def natives = layout.buildDirectory.dir('sim-natives')
def extractNatives = tasks.register('extractSimNatives', Sync) {
    from(configurations.simNatives.collect { zipTree(it) }) { include '**/shared/*.so*'; eachFile { path = name } }
    from("${System.getProperty('user.home')}/.cache/spectrum-vision-deps/libstdcxx/x/usr/lib/x86_64-linux-gnu") {
        include 'libstdc++.so.6*'
    }
    includeEmptyDirs = false
    into natives
}
def patchNatives = tasks.register('patchSimNatives', Exec) {
    dependsOn extractNatives
    doFirst {
        def lib = fileTree(natives) { include '*.so*'; exclude 'libstdc++*' }.files*.path
        commandLine(['python3', "${rootDir}/tools/ubuntu2204-sim/glibc238_compat.py"] + lib)
    }
}
// Java 25 warns, at length, about WPILib loading its native libraries and about quickbuf (its
// protobuf library) using sun.misc.Unsafe. Both are expected here.
def jdk25Quiet = ['--enable-native-access=ALL-UNNAMED', '--sun-misc-unsafe-memory-access=allow']
tasks.register('simTest', Test) {
    description = 'End-to-end in WPILib simulation: PhotonLib VisionSystemSim -> PhotonCamera -> VisionSystem -> estimator'
    testClassesDirs = sourceSets.simTest.output.classesDirs
    classpath = sourceSets.simTest.runtimeClasspath
    dependsOn patchNatives
    systemProperty 'java.library.path', natives.get().asFile.path
    environment 'LD_LIBRARY_PATH', natives.get().asFile.path
    jvmArgs jdk25Quiet
    testLogging { showStandardStreams = true }
}

// The SystemCore rehearsal: a WPILib 2027 robot program here, a real Jetson connected to it.
// Run through tests/systemcore-rehearsal/run.sh, which points the Jetson at this machine.
tasks.register('rehearsal', JavaExec) {
    description = 'SystemCore rehearsal against a real Jetson (tests/systemcore-rehearsal/run.sh)'
    classpath = sourceSets.rehearsal.runtimeClasspath
    mainClass = 'org.spectrum3847.vision.rehearsal.Rehearsal'
    dependsOn patchNatives
    workingDir = layout.buildDirectory.dir('rehearsal').get().asFile
    doFirst { workingDir.mkdirs() }
    systemProperty 'java.library.path', natives.get().asFile.path
    environment 'LD_LIBRARY_PATH', natives.get().asFile.path
    jvmArgs jdk25Quiet
    ['rehearsal.jetson', 'rehearsal.link', 'rehearsal.phases'].each { k ->
        if (project.hasProperty(k)) systemProperty k, project.property(k)
    }
}
