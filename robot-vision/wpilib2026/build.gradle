// The roboRIO build: WPILib 2026, PhotonLib 2026. Sources: src/main + src/compat2026.
def wpilib = '2026.2.1'
def photon = 'v2026.3.4'

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

repositories {
    // The local WPILib install first: it has everything but PhotonLib, and frcmaven.wpi.edu isn't
    // reachable from every network.
    rootProject.wpilibMavens('2026').each { dir -> maven { url = uri(dir) } }
    maven { url = 'https://frcmaven.wpi.edu/artifactory/release' }
    maven { url = 'https://maven.photonvision.org/releases' }
    maven { url = 'https://maven.ctr-electronics.com/release/' }                      // examples only
    // AdvantageKit (examples only), from its GitHub release's offline Maven repo, which build.sh
    // downloads: frcmaven.wpi.edu, where it's normally hosted, isn't reachable from every network.
    exclusiveContent {
        forRepository {
            maven { url = uri("${System.getProperty('user.home')}/.cache/spectrum-vision-deps/akit-v26.0.2/maven_offline") }
        }
        filter { includeGroup 'org.littletonrobotics.akit' }
    }
    mavenCentral()
}

sourceSets {
    main { java { srcDirs = ['../src/main/java', '../src/compat2026/java'] } }
    // The tuning example runs as a test (it's what teams copy).
    test { java { srcDirs = ['../src/test/java'] ; srcDir '../examples'; include 'org/**', 'VisionTuningTest.java' } }
    // The other examples compile against the real CTRE and AdvantageKit libraries.
    examples { java { srcDirs = ['../examples']; exclude '**/VisionTuningTest.java', 'wpilib2027/**' } }
    // The end-to-end simulation test (PhotonLib's simulation, a real PhotonCamera): needs natives.
    simTest { java { srcDirs = ['../src/simTest/java'] } }
}

configurations { simNatives }

dependencies {
    // What a 2026 robot project already has (GradleRIO + the PhotonLib vendordep): compileOnly for
    // the library, and on the test classpath. The tests are plain Java (no native libraries).
    def wpi = [
        "edu.wpi.first.wpilibj:wpilibj-java:$wpilib", "edu.wpi.first.wpimath:wpimath-java:$wpilib",
        "edu.wpi.first.wpiutil:wpiutil-java:$wpilib", "edu.wpi.first.ntcore:ntcore-java:$wpilib",
        "edu.wpi.first.hal:hal-java:$wpilib", "edu.wpi.first.apriltag:apriltag-java:$wpilib",
        "edu.wpi.first.wpiunits:wpiunits-java:$wpilib", "edu.wpi.first.cscore:cscore-java:$wpilib",
        "edu.wpi.first.cameraserver:cameraserver-java:$wpilib",
        "edu.wpi.first.thirdparty.frc2025.opencv:opencv-java:4.10.0-3",
        "org.photonvision:photonlib-java:$photon", "org.photonvision:photontargeting-java:$photon",
        "org.ejml:ejml-simple:0.44.0", "com.fasterxml.jackson.core:jackson-annotations:2.19.2",
        "com.fasterxml.jackson.core:jackson-core:2.19.2", "com.fasterxml.jackson.core:jackson-databind:2.19.2",
        "us.hebi.quickbuf:quickbuf-runtime:1.4",
    ]
    wpi.each { compileOnly it; testImplementation it; examplesImplementation it; simTestImplementation it }
    simTestImplementation sourceSets.main.output
    simTestImplementation platform('org.junit:junit-bom:5.10.1')
    simTestImplementation 'org.junit.jupiter:junit-jupiter'
    simTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // This machine's native libraries for WPILib's desktop simulation and PhotonLib.
    def nativePlatform = rootProject.simPlatform
    ['wpiutil', 'wpimath', 'wpinet', 'ntcore', 'hal', 'cscore', 'apriltag'].each {
        simNatives "edu.wpi.first.${it}:${it}-cpp:$wpilib:$nativePlatform@zip"
    }
    simNatives "edu.wpi.first.thirdparty.frc2025.opencv:opencv-cpp:4.10.0-3:$nativePlatform@zip"
    simNatives "org.photonvision:photontargeting-cpp:$photon:$nativePlatform@zip"
    examplesImplementation sourceSets.main.output
    examplesImplementation 'com.ctre.phoenix6:wpiapi-java:26.3.0'           // Phoenix6-frc2026-latest.json
    examplesImplementation 'org.littletonrobotics.akit:akit-java:26.0.2'     // AdvantageKit.json (2026)
    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { dependsOn 'compileExamplesJava' }

def natives = layout.buildDirectory.dir('sim-natives')
def extractNatives = tasks.register('extractSimNatives', Sync) {
    from(configurations.simNatives.collect { zipTree(it) }) { include '**/shared/*.so*', '**/shared/*.dll'; eachFile { path = name } }
    // tools/ubuntu2204-sim/get-libstdcxx.sh (run by build.sh) puts a newer libstdc++ here when this
    // system's is too old for PhotonLib's native library (Ubuntu 22.04).
    from("${System.getProperty('user.home')}/.cache/spectrum-vision-deps/libstdcxx/x/usr/lib/x86_64-linux-gnu") {
        include 'libstdc++.so.6*'
    }
    includeEmptyDirs = false
    into natives
}
tasks.register('simTest', Test) {
    description = 'End-to-end in WPILib simulation: PhotonLib VisionSystemSim -> PhotonCamera -> VisionSystem -> estimator'
    testClassesDirs = sourceSets.simTest.output.classesDirs
    classpath = sourceSets.simTest.runtimeClasspath
    dependsOn extractNatives
    systemProperty 'java.library.path', natives.get().asFile.path
    environment 'LD_LIBRARY_PATH', natives.get().asFile.path
    // Windows finds a DLL's own dependencies on PATH.
    if (rootProject.windows) environment 'PATH', natives.get().asFile.path + File.pathSeparator + System.getenv('PATH')
    testLogging { showStandardStreams = true }
}

// The drop-in copy for a robot project: org/spectrum3847/vision/** (main + compat).
tasks.register('sourceDrop', Zip) {
    archiveFileName = 'SpectrumVision-wpilib2026-src.zip'
    destinationDirectory = layout.buildDirectory.dir('drop')
    from('../src/main/java') { include 'org/**' }
    from('../src/compat2026/java') { include 'org/**' }
}
