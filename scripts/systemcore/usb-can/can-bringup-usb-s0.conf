# Drop-in for can-bringup.service (DIY SystemCore): when the CANable is plugged in, wait for its slcan netdev
# (IFACE in /etc/sc-usb-can.conf, can_s0) before diy-can-setup.sh runs. diy-can-setup.sh only creates a vcan
# placeholder when the name does not exist yet, and loads robot_heartbeat/can_sender (which bind can_s* at load)
# afterwards, so the adapter becomes the robot's bus 0. No adapter: no wait, vcan as before.
[Service]
ExecStartPre=/opt/sc-usb-can/usb-can-up.sh --wait
